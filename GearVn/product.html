<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm GearVn</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #121a24;
            --panel-2: #172331;
            --line: rgba(255, 255, 255, 0.08);
            --text: #f5f7fb;
            --muted: #95a3b8;
            --cyan: #67e8f9;
            --green: #6ee7b7;
            --red: #fb7185;
            --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(103, 232, 249, 0.12), transparent 28%),
                radial-gradient(circle at top right, rgba(110, 231, 183, 0.10), transparent 25%),
                linear-gradient(180deg, #071018 0%, #0d1117 48%, #0b121a 100%);
            color: var(--text);
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .shell {
            max-width: 1320px;
            margin: 0 auto;
            padding: 0 24px 56px;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(14px);
            background: rgba(7, 16, 24, 0.86);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .topbar-inner {
            max-width: 1320px;
            margin: 0 auto;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        .brand {
            font-size: 1.6rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 2px;
            text-transform: none;
            color: #ffffff;
            text-shadow: 0 0 8px #ffffff, 0 0 20px #ffffff55, 0 0 40px #ffffff22;
            transition: 0.25s ease;
            user-select: none;
        }

        .brand span {
            color: var(--green);
            text-shadow: 0 0 8px var(--green), 0 0 20px rgba(110, 231, 183, 0.45), 0 0 40px rgba(110, 231, 183, 0.2);
        }

        .brand:hover {
            letter-spacing: 4px;
            text-shadow: 0 0 12px #ffffff, 0 0 30px #ffffff88, 0 0 60px #ffffff44;
        }

        .nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav a {
            color: var(--muted);
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid transparent;
            transition: 0.25s ease;
        }

        .nav a:hover,
        .nav a.active {
            color: var(--text);
            border-color: rgba(103, 232, 249, 0.28);
            background: rgba(103, 232, 249, 0.08);
        }

        .hero {
            padding: 48px 0 30px;
            display: block;
        }

        .hero-copy {
            background: linear-gradient(180deg, rgba(18, 26, 36, 0.96), rgba(18, 26, 36, 0.76));
            border: 1px solid var(--line);
            border-radius: 28px;
            box-shadow: var(--shadow);
        }

        .hero-copy {
            padding: 32px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.82rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--cyan);
            margin-bottom: 18px;
        }

        .hero h1 {
            font-size: clamp(2rem, 4vw, 3.8rem);
            line-height: 1.08;
            margin-bottom: 18px;
        }

        .hero p {
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.8;
            max-width: 700px;
        }

        .hero-actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            font-weight: 700;
            letter-spacing: 0.04em;
            transition: 0.25s ease;
        }

        .btn-primary {
            color: #071018;
            background: linear-gradient(135deg, var(--cyan), var(--green));
            border-color: transparent;
        }

        .btn-secondary:hover,
        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .filters {
            margin-top: 10px;
            margin-bottom: 24px;
            display: grid;
            gap: 16px;
        }

        .search-wrap,
        .category-wrap {
            background: rgba(18, 26, 36, 0.8);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 18px;
        }

        .search-box {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            min-width: 240px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: var(--text);
            padding: 14px 16px;
            outline: none;
        }

        .category-list {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .chip {
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: var(--muted);
            padding: 10px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .chip.active,
        .chip:hover {
            color: var(--text);
            border-color: rgba(103, 232, 249, 0.32);
            background: rgba(103, 232, 249, 0.09);
        }

        .result-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 14px 0 20px;
            color: var(--muted);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .card {
            display: flex;
            flex-direction: column;
            min-height: 100%;
            background: linear-gradient(180deg, rgba(18, 26, 36, 0.95), rgba(14, 20, 29, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: 0.28s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(103, 232, 249, 0.28);
        }

        .card-media {
            height: 230px;
            padding: 20px;
            background:
                radial-gradient(circle at top, rgba(103, 232, 249, 0.18), transparent 50%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .card-media img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .badge {
            position: absolute;
            top: 14px;
            left: 14px;
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--cyan);
            background: rgba(7, 16, 24, 0.78);
            border: 1px solid rgba(103, 232, 249, 0.24);
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .card-index {
            color: var(--muted);
            font-size: 0.78rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .card h3 {
            font-size: 1.05rem;
            line-height: 1.45;
        }

        .card p {
            color: var(--muted);
            line-height: 1.7;
            font-size: 0.94rem;
            flex: 1;
        }

        .price {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--green);
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .card-actions a {
            flex: 1;
        }

        .empty {
            padding: 28px;
            border-radius: 24px;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            color: var(--muted);
            text-align: center;
            background: rgba(18, 26, 36, 0.55);
        }

        @media (max-width: 1100px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 720px) {
            .topbar-inner,
            .shell {
                padding-left: 16px;
                padding-right: 16px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .result-meta,
            .card-actions,
            .search-box {
                flex-direction: column;
            }

            .nav {
                width: 100%;
            }

            .nav a {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a href="index.html" class="brand">Gear<span>VN</span></a>
            <nav class="nav">
                <a href="index.html">Trang chủ</a>
                <a href="product.html" class="active">Sản phẩm</a>
            </nav>
        </div>
    </header>

    <div class="shell">
        <section class="hero">
            <div class="hero-copy">
                <h1>Tất cả sản phẩm của GearVn</h1>
                <p>
                </p>
                <div class="hero-actions">
                    <a class="btn btn-primary" href="#catalog">Xem danh sách</a>
                    <a class="btn btn-secondary" href="index.html">Về trang chủ</a>
                </div>
            </div>
        </section>
        <section id="catalog" class="filters">
            <div class="search-wrap">
                <div class="search-box">
                    <input id="searchInput" type="text" placeholder="Tìm theo tên sản phẩm, danh mục, mô tả...">
                    <a class="btn btn-primary" href="#grid">Lọc ngay</a>
                </div>
            </div>
            <div class="category-wrap">
                <strong>Danh mục</strong>
                <div class="category-list" id="categoryList"></div>
            </div>
        </section>

        <div class="result-meta">
            <div id="resultText">Đang hiển thị tất cả sản phẩm</div>
            <div>GearVn Catalog 2026</div>
        </div>

        <section id="grid" class="grid"></section>
    </div>

    <script src="products.js"></script>
    <script>
        const grid = document.getElementById('grid');
        const searchInput = document.getElementById('searchInput');
        const categoryList = document.getElementById('categoryList');
        const resultText = document.getElementById('resultText');

        let activeCategory = 'Tất cả';

        const categories = ['Tất cả', ...new Set(window.PRODUCTS.map((product) => product.category))];

        function createCard(product) {
            return `
                <article class="card">
                    <div class="card-media">
                        <span class="badge">${product.category}</span>
                        <img src="${product.imageUrl}" alt="${product.name}" loading="lazy">
                    </div>
                    <div class="card-body">
                        <div class="card-index">SP ${String(product.id).padStart(2, '0')}</div>
                        <h3>${product.name}</h3>
                        <p>${product.description}</p>
                        <div class="price">${window.formatProductPrice(product.price)}</div>
                        <div class="card-actions">
                            <a class="btn btn-primary" href="productdetail.html?id=${product.id}">Xem chi tiết</a>
                            <a class="btn btn-secondary" href="index.html#products">Về trang chủ</a>
                        </div>
                    </div>
                </article>
            `;
        }

        function renderCategories() {
            categoryList.innerHTML = categories.map((category) => `
                <button class="chip ${category === activeCategory ? 'active' : ''}" type="button" data-category="${category}">
                    ${category}
                </button>
            `).join('');

            categoryList.querySelectorAll('.chip').forEach((button) => {
                button.addEventListener('click', () => {
                    activeCategory = button.dataset.category;
                    renderCategories();
                    renderProducts();
                });
            });
        }

        function renderProducts() {
            const keyword = searchInput.value.trim().toLowerCase();
            const filtered = window.PRODUCTS.filter((product) => {
                const inCategory = activeCategory === 'Tất cả' || product.category === activeCategory;
                const haystack = `${product.name} ${product.category} ${product.description}`.toLowerCase();
                return inCategory && haystack.includes(keyword);
            });

            resultText.textContent = `Tìm thấy ${filtered.length} sản phẩm${activeCategory !== 'Tất cả' ? ` trong nhóm ${activeCategory}` : ''}.`;

            if (!filtered.length) {
                grid.innerHTML = '<div class="empty">Không tìm thấy sản phẩm phù hợp. Thử đổi từ khóa hoặc chọn danh mục khác.</div>';
                return;
            }

            grid.innerHTML = filtered.map(createCard).join('');
        }

        searchInput.addEventListener('input', renderProducts);

        renderCategories();
        renderProducts();
    </script>
</body>
</html>
